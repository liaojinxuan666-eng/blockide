<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOCKIDE — terminal edition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="crt">
<div class="term">

  <!-- 顶部菜单栏 -->
  <header class="menubar">
    <div class="brand">▚ BLOCKIDE<span class="brand-dim"> v0.2.0</span></div>
    <nav class="menu">
      <span class="menu-item"><kbd>F1</kbd> 帮助</span>
      <span class="menu-item"><kbd>F2</kbd> 示例</span>
      <span class="menu-item"><kbd>F5</kbd> 运行</span>
    </nav>
    <div class="menu-right">● connected</div>
  </header>

  <!-- 命令栏 -->
  <div class="cmdbar">
    <span class="prompt">blockide:~$</span>
    <span id="cmdEcho" class="cmd-echo">载入示例程序… 输入 <kbd>F1</kbd> 查看快捷键</span>
  </div>

  <!-- 三栏工作区 -->
  <main class="workspace-grid">

    <!-- 左：积木库 -->
    <section class="pane" id="panePalette" tabindex="0">
      <div class="pane-head"><span class="pane-title">┤ BLOCKS ├</span><span class="pane-hint" id="paletteCount">0</span></div>
      <div class="pane-body">
        <div class="search-line"><span class="fg-dim">/search:</span> <input id="blockSearch" class="term-input" placeholder="过滤积木…" spellcheck="false"></div>
        <div id="categories" class="categories"></div>
        <div id="palette" class="palette"></div>
      </div>
      <div class="pane-foot"><kbd>↑↓</kbd> 选择 <kbd>Enter</kbd> 添加</div>
    </section>

    <!-- 中：画布 -->
    <section class="pane" id="paneCanvas" tabindex="0">
      <div class="pane-head"><span class="pane-title">┤ CANVAS ├</span><span class="pane-hint" id="canvasCount">0 blocks</span></div>
      <div class="pane-body" id="workspace"></div>
      <div class="pane-foot"><kbd>↑↓</kbd> 导航 <kbd>Enter</kbd> 编辑 <kbd>Del</kbd> 删除 <kbd>Space</kbd> 添加</div>
    </section>

    <!-- 右：代码 + 控制台 -->
    <section class="pane code-pane" id="paneCode" tabindex="0">
      <div class="pane-head">
        <span class="pane-title">┤ SOURCE ├</span>
        <div class="lang-tabs" id="langSwitch">
          <button data-lang="c">C</button><button data-lang="cpp">C++</button><button data-lang="swift">SWIFT</button>
        </div>
      </div>
      <div class="pane-body code-body">
        <div class="code-scroll">
          <div id="code" class="code"></div>
          <textarea id="codeEditor" class="code-editor" spellcheck="false" hidden></textarea>
        </div>
        <div class="console-head"><span>┤ OUTPUT ├</span><button id="clearBtn">clear</button></div>
        <div id="console" class="console"></div>
      </div>
      <div class="pane-foot"><kbd>e</kbd> 编辑代码 <kbd>Ctrl+S</kbd> 应用 <kbd>c</kbd> 复制</div>
    </section>

  </main>

  <!-- 编辑代码操作条 -->
  <div class="edit-bar" id="editActions" hidden>
    <span class="fg-amber">● EDIT MODE</span>
    <span class="fg-dim">修改后按</span> <kbd>Ctrl+S</kbd> <span class="fg-dim">应用，</span> <kbd>Esc</kbd> <span class="fg-dim">取消</span>
    <button id="applyEdit" class="term-btn">[ 应用 ]</button>
    <button id="cancelEdit" class="term-btn">[ 取消 ]</button>
  </div>

  <!-- 底部状态栏 -->
  <footer class="statusbar">
    <span id="status" class="status-msg">READY</span>
    <span class="status-right">
      <span id="statusLang">SWIFT</span> │
      <span id="statusBlocks">0 BLOCKS</span> │
      <span id="statusLines">0 LINES</span> │
      <span>UTF-8</span> │
      <span class="fg-green">● NORMAL</span>
    </span>
  </footer>

  <!-- 帮助 / 示例 / 提示 浮层 -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay-box" id="overlayBox"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

</div>
</div>

<script src="js/blocks.js"></script>
<script src="js/generators.js"></script>
<script src="js/engine.js"></script>
<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
