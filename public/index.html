<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>积木 IDE · C / C++ / Swift</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">🧩</div>
        <div>
          <h1>积木 IDE</h1>
          <p>像拼积木一样写 C / C++ / Swift</p>
        </div>
      </div>
      <div class="toolbar">
        <select id="exampleSelect" class="select-ctl" title="切换示例程序"></select>
        <div class="segmented" id="langSwitch">
          <button data-lang="c">C</button>
          <button data-lang="cpp">C++</button>
          <button data-lang="swift">Swift</button>
        </div>
        <button id="undoBtn" class="btn ghost icon-btn" title="撤销 (Ctrl+Z)">↶</button>
        <button id="redoBtn" class="btn ghost icon-btn" title="重做 (Ctrl+Shift+Z)">↷</button>
        <button id="runBtn" class="btn primary">▶ 运行</button>
      </div>
    </header>

    <div class="hint">
      <span>拖积木到画布拼装</span>
      <span>拖动已有积木调整顺序</span>
      <span>点积木 / 代码行双向高亮</span>
      <span>编辑代码会自动同步回积木</span>
      <span>Ctrl+Z 撤销</span>
    </div>

    <main class="layout">
      <aside class="panel palette-panel">
        <div class="panel-head"><h2>积木盒</h2><span class="badge">拖入画布</span></div>
        <div class="search-wrap"><input id="blockSearch" class="search-ctl" type="text" placeholder="🔍 搜索积木…"></div>
        <div id="categories" class="categories"></div>
        <div id="palette" class="palette"></div>
        <div class="panel-foot">点击分类切换积木库</div>
      </aside>

      <section class="panel canvas-panel">
        <div class="panel-head"><h2>画布</h2><span class="badge">拖动拼装</span></div>
        <div id="workspace" class="workspace"></div>
      </section>

      <section class="panel code-panel">
        <div class="panel-head">
          <h2>代码 <span id="codeLang" class="code-lang">Swift</span></h2>
          <div class="code-actions">
            <button id="editToggle" class="btn tiny" title="编辑模式：直接改代码">✎ 编辑</button>
            <button id="copyBtn" class="btn tiny">复制</button>
            <button id="exportBtn" class="btn tiny" title="下载源码文件">导出</button>
            <button id="importBtn" class="btn tiny" title="从源码文件导入">导入</button>
            <input id="importFile" type="file" accept=".c,.cpp,.swift,.txt" hidden>
          </div>
        </div>
        <div class="code-scroll">
          <div id="code" class="code"></div>
          <textarea id="codeEditor" class="code-editor" spellcheck="false" hidden></textarea>
        </div>
        <div id="editHint" class="edit-hint" hidden>编辑后点击「✓ 应用」同步回积木，或按 Esc 取消</div>
        <div class="code-actions-edit" id="editActions" hidden>
          <button id="applyEdit" class="btn primary tiny">✓ 应用</button>
          <button id="cancelEdit" class="btn ghost tiny">取消</button>
        </div>
        <div class="console-wrap">
          <div class="console-head"><span>控制台输出</span><button id="clearBtn">清空</button></div>
          <div id="console" class="console"></div>
        </div>
      </section>
    </main>

    <footer id="status" class="status"></footer>
    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="js/blocks.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
